###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod, return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, F, exec, firefox
bind = $mainMod, R, exec, change_wallpaper.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, j, layoutmsg, togglesplit
bind = $mainMod ALT, Q, exec, wlogout
bind = $mainMod, L, exec, hyprlock -c /home/mightypancake/nixos/home/hyprlock/hyprlock.conf; change_wallpaper.sh
bind = $mainMod, K, exec, asusctl leds next
bind = $mainMod, B, exec, pkill -9 wayle; sleep 0.5; wayle shell &
bind = $mainMod, Y, exec, kttyl y

# WASD - Arrow keys while holding Alt
binde = ALT, W, sendshortcut, , up, activewindow
binde = ALT, A, sendshortcut, , left, activewindow
binde = ALT, S, sendshortcut, , down, activewindow
binde = ALT, D, sendshortcut, , right, activewindow

# Media
bind  = ALT, J, exec, playerctl previous
bind  = ALT, K, exec, playerctl play-pause
bind  = ALT, L, exec, playerctl next
binde = ALT, M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = ALT, I, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ALT, U, exec, hyprctl notify 1 5000 0 "$(printf '\t%s\n\tby %s' "$(playerctl metadata xesam:title)" "$(playerctl metadata xesam:artist)")"
bind  = ALT, semicolon, exec, playerctl position 5-
bind  = ALT, apostrophe, exec, playerctl position 5+

# Media - Mouse
# ----------- Mouse Mod Layer -----------
# BTN_SIDE acts as mod key
# Scroll volume
# binde = BTN_SIDE, SCROLL_UP, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# binde = BTN_SIDE, SCROLL_DOWN, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind = BTN_SIDE, BTN_EXTRA, exec, playerctl play-pause
# bind = BTN_SIDE, BTN_LEFT, exec, playerctl previous
# bind = BTN_SIDE, BTN_RIGHT, exec, playerctl next



# bind = $mainMod ALT, W, exec,
bind = $mainMod ALT, W, fullscreen, 1
bind = $mainMod CTRL, F, fullscreen, 0

# Emulating LALT + WASD
# bind = $mainMod, A, sendshortcut, , X

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window to neighboring window (swap)
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Change split ratio
# binde = $mainMod ALT, up, splitratio, +0.1
# binde = $mainMod ALT, down, splitratio, -0.1
binde = $mainMod ALT, right, resizeactive, 10 0
binde = $mainMod ALT, left, resizeactive, -10 0
binde = $mainMod ALT, up, resizeactive, 0 -10
binde = $mainMod ALT, down, resizeactive, 0 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, exec, grimblast copy area

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ,XF86AudioRaiseVolume, exec, volume-step.sh up
bindel = ,XF86AudioLowerVolume, exec, volume-step.sh down
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Soundboard!
bind = CTRL $mainMod ALT, 1, exec, ffplay -nodisp -autoexit -af "volume=1.0" ~/nixos/sounds/1.mp3 > /dev/null 2>&1 &
bind = CTRL $mainMod ALT, 2, exec, ffplay -nodisp -autoexit -af "volume=1.0" ~/nixos/sounds/2.mp3 > /dev/null 2>&1 &

